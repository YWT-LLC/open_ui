name: open_ui
description: "Build apps for anyone. Open UI makes building truly accessible apps Ez. So anyone can enjoy your great idea!"
version: 13.0.0
publish_to: 'none'
repository: https://github.com/YWT-LLC/open_ui

environment:
   sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_test:
    sdk: flutter

  # Flutter (Google)
  google_fonts: ^8.2.1
  go_router: ^18.0.1
  http: ^1.6.0
  image_picker: ^1.2.3
  intl: ^0.20.3
  path_provider: ^2.1.6
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2
  video_player: ^2.14.0
  web: ^1.1.1
  
  # Community
  country_flags: ^4.1.2
  extended_image: ^10.1.0
  file_picker: ^13.1.0
  file_saver: ^0.6.0
  flex_color_picker: ^4.0.0
  flutter_localized_locales: ^2.0.5
  flutter_secure_storage: ^11.2.0
  font_awesome_flutter: ^11.0.0
  image: ^4.10.1
  line_icons: ^2.0.3
  package_info_plus: ^10.2.1
  permission_handler: ^13.0.2
  provider: ^6.1.5+1
  window_manager: ^0.5.2

  # YWT (local)
  ywt_private:
    path: ../ywt_private
  
dev_dependencies:
  ## For development
  dependency_validator: ^5.1.0
  flutter_lints: ^6.0.0

  ## For example app (Open UI)
  # Community
  after_layout: ^1.2.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8
  xml: ^7.0.1

flutter:
  generate: true

  assets:
    - assets/
    - assets/nebula.jpg
    - assets/wall-holes.jpg