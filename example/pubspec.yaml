name: example
description: "Open UI is an accessibility sandbox, with limitless potential. If you like it, checkout https://github.com/YWT-LLC/open_ui"
version: 4.0.2+43
publish_to: 'none'

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Flutter (Google)
  go_router: ^18.0.0
  intl: ^0.20.3
  shared_preferences: ^2.5.5

  # Community
  after_layout: ^1.2.0
  file_picker: ^12.1.2
  file_saver: ^0.4.0
  line_icons: ^2.0.3
  provider: ^6.1.5+1
  window_manager: ^0.5.2
  xml: ^7.0.1

  # YWT
  open_ui:
    path: ../
  ywt_private:
    path: ../../ywt_private

dev_dependencies:
  dependency_validator: ^5.0.6
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.8

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/
    - assets/app-icon.png

flutter_launcher_icons:
  image_path: assets/app-icon.png
  adaptive_icon_foreground: assets/app-icon.png
  adaptive_icon_background: "#A520DA"
  android: true
  ios: true
  background_color_ios: "#A520DA"
  remove_alpha_ios: true
  web:
    generate: true
    background_color: "#A520DA"
  windows:
    generate: true
  macos:
    generate: true

flutter_native_splash:
  image: assets/app-icon.png
  image_dark: assets/app-icon.png
  color: "#A520DA"
  color_dark: "#A520DA"
  android: true
  ios: true
  web: true
